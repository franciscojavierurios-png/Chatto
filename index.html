<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Talk2Me — Consulta lo desconocido</title>
  <meta name="description" content="Habla con Dios, el Diablo, la Ouija y Nostradamus. 10 consultas gratis."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void: #080608;
      --deep: #0e0b0f;
      --surface: #141016;
      --raised: #1c1720;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.1);
      --text: #e8e0d5;
      --text2: #9a8fa0;
      --text3: #5a5060;

      --god: #c9a84c;
      --god-dim: rgba(201,168,76,0.12);
      --devil: #c0392b;
      --devil-dim: rgba(192,57,43,0.12);
      --ouija: #4a9e8e;
      --ouija-dim: rgba(74,158,142,0.12);
      --nostra: #8e6ab0;
      --nostra-dim: rgba(142,106,176,0.12);
    }

    html, body {
      height: 100%;
      background: var(--void);
      color: var(--text);
      font-family: 'Crimson Pro', serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      background: var(--deep);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    @media (min-width: 500px) {
      body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; background: var(--void); }
      .shell {
        height: min(820px, 95dvh);
        border-radius: 2px;
        border: 1px solid var(--border2);
        box-shadow: 0 0 80px rgba(0,0,0,0.8), 0 0 160px rgba(0,0,0,0.4);
      }
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 14px;
      background: var(--deep);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 20px; right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border2), transparent);
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.15em;
      color: var(--text);
      text-transform: uppercase;
    }

    .logo-accent { color: var(--god); }

    .credits-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 2px;
      padding: 5px 12px;
      font-family: 'Crimson Pro', serif;
      font-size: 13px;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }
    .credits-pill:hover { border-color: var(--god); color: var(--god); }
    .credits-pill strong { color: var(--god); font-weight: 600; }

    /* ── ENTITY SELECTOR ── */
    .entities {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .entity-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 8px 12px;
      border: none;
      border-right: 1px solid var(--border);
      background: var(--deep);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .entity-btn:last-child { border-right: none; }

    .entity-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .entity-btn[data-id="god"]::before    { background: var(--god-dim); }
    .entity-btn[data-id="devil"]::before  { background: var(--devil-dim); }
    .entity-btn[data-id="ouija"]::before  { background: var(--ouija-dim); }
    .entity-btn[data-id="nostra"]::before { background: var(--nostra-dim); }

    .entity-btn:hover::before,
    .entity-btn.active::before { opacity: 1; }

    .entity-btn.active[data-id="god"]    { border-bottom: 2px solid var(--god); }
    .entity-btn.active[data-id="devil"]  { border-bottom: 2px solid var(--devil); }
    .entity-btn.active[data-id="ouija"]  { border-bottom: 2px solid var(--ouija); }
    .entity-btn.active[data-id="nostra"] { border-bottom: 2px solid var(--nostra); }

    .entity-glyph {
      font-size: 22px;
      line-height: 1;
      filter: grayscale(0.3);
      transition: filter 0.2s, transform 0.2s;
      position: relative;
      z-index: 1;
    }
    .entity-btn:hover .entity-glyph,
    .entity-btn.active .entity-glyph { filter: grayscale(0) drop-shadow(0 0 6px currentColor); transform: scale(1.05); }

    .entity-name {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text3);
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      transition: color 0.2s;
    }
    .entity-btn.active[data-id="god"]    .entity-name { color: var(--god); }
    .entity-btn.active[data-id="devil"]  .entity-name { color: var(--devil); }
    .entity-btn.active[data-id="ouija"]  .entity-name { color: var(--ouija); }
    .entity-btn.active[data-id="nostra"] .entity-name { color: var(--nostra); }

    /* ── CHAT ── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--deep);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--raised) transparent;
    }

    /* INTRO */
    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      padding: 40px 24px;
      flex: 1;
      min-height: 200px;
      animation: materialize 0.6s ease;
    }

    @keyframes materialize {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .intro-sigil {
      font-size: 56px;
      line-height: 1;
      filter: drop-shadow(0 0 16px var(--accent-color, #c9a84c));
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 16px var(--accent-color, #c9a84c)); }
      50%       { filter: drop-shadow(0 0 28px var(--accent-color, #c9a84c)); }
    }

    .intro-title {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0.1em;
      color: var(--accent-color, var(--god));
    }

    .intro-lore {
      font-size: 16px;
      font-style: italic;
      color: var(--text2);
      max-width: 260px;
      line-height: 1.7;
    }

    .intro-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-color, var(--god)), transparent);
    }

    .intro-prompt {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text3);
      text-transform: uppercase;
    }

    /* MESSAGES */
    .msg { display: flex; gap: 10px; animation: materialize 0.25s ease; }
    .msg.user { flex-direction: row-reverse; }

    .av {
      width: 34px; height: 34px;
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; margin-top: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .msg.user .av {
      background: var(--raised);
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 0.1em;
      color: var(--text3);
    }

    .msg-col { display: flex; flex-direction: column; gap: 3px; max-width: 78%; }
    .msg.user .msg-col { align-items: flex-end; }

    .msg-from {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--text3);
      text-transform: uppercase;
      padding: 0 3px;
    }

    .bubble {
      padding: 11px 14px;
      font-size: 15px;
      line-height: 1.65;
      font-style: italic;
    }

    .msg.bot .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0;
      color: var(--text);
    }

    .msg.user .bubble {
      background: var(--raised);
      border: 1px solid var(--border2);
      border-bottom-right-radius: 0;
      color: var(--text);
      font-style: normal;
    }

    /* accent borders per entity */
    .msg.bot.god-msg    .bubble { border-left: 2px solid var(--god); }
    .msg.bot.devil-msg  .bubble { border-left: 2px solid var(--devil); }
    .msg.bot.ouija-msg  .bubble { border-left: 2px solid var(--ouija); }
    .msg.bot.nostra-msg .bubble { border-left: 2px solid var(--nostra); }

    /* TYPING */
    .typing { display: flex; gap: 10px; animation: materialize 0.2s ease; }
    .typing-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 16px;
      display: flex; gap: 6px; align-items: center;
    }
    .dot { width: 5px; height: 5px; background: var(--text3); border-radius: 50%; animation: flicker 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.25s; }
    .dot:nth-child(3) { animation-delay: 0.5s; }
    @keyframes flicker {
      0%,60%,100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.2); background: var(--accent-color, var(--god)); }
    }

    /* ── INPUT ── */
    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 14px;
      background: var(--deep);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }

    .input-bar::before {
      content: '';
      position: absolute;
      top: 0; left: 20px; right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border2), transparent);
    }

    .msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border2);
      padding: 11px 14px;
      color: var(--text);
      font-family: 'Crimson Pro', serif;
      font-size: 16px;
      resize: none;
      max-height: 100px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.4;
      border-radius: 2px;
      -webkit-appearance: none;
    }
    .msg-input::placeholder { color: var(--text3); font-style: italic; }
    .msg-input:focus { border-color: var(--accent-color, var(--god)); }

    .send-btn {
      width: 44px; height: 44px;
      min-width: 44px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 2px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      color: var(--text2);
      -webkit-tap-highlight-color: transparent;
    }
    .send-btn:hover { background: var(--raised); border-color: var(--accent-color, var(--god)); color: var(--accent-color, var(--god)); }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── PAYWALL ── */
    .paywall {
      display: none;
      position: absolute; inset: 0;
      background: rgba(8,6,8,0.96);
      backdrop-filter: blur(10px);
      z-index: 100;
      align-items: center; justify-content: center;
      padding: 24px;
      animation: materialize 0.3s ease;
    }
    .paywall.show { display: flex; }

    .pw-card {
      background: var(--deep);
      border: 1px solid var(--border2);
      padding: 32px 24px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      position: relative;
    }

    .pw-card::before, .pw-card::after {
      content: '✦';
      position: absolute;
      font-size: 10px;
      color: var(--text3);
    }
    .pw-card::before { top: 10px; left: 14px; }
    .pw-card::after  { bottom: 10px; right: 14px; }

    .pw-sigil { font-size: 44px; margin-bottom: 14px; display: block; }
    .pw-title {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.1em;
      color: var(--text);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .pw-sub { font-size: 15px; font-style: italic; color: var(--text2); line-height: 1.7; margin-bottom: 24px; }

    .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }

    .plan {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }

    .plan.chosen { border-color: var(--god); background: rgba(201,168,76,0.06); }

    .plan-tag {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 0.15em;
      color: var(--god);
      text-transform: uppercase;
    }
    .plan-space { height: 16px; }
    .plan-price { font-family: 'Cinzel', serif; font-weight: 700; font-size: 26px; color: var(--text); line-height: 1; }
    .plan-name { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.1em; color: var(--text2); text-transform: uppercase; }
    .plan-desc { font-size: 12px; font-style: italic; color: var(--text3); line-height: 1.5; text-align: center; margin: 4px 0 10px; }

    .plan-btn {
      width: 100%;
      background: var(--raised);
      color: var(--text2);
      border: 1px solid var(--border2);
      padding: 9px 8px;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 1px;
    }
    .plan-btn:hover { border-color: var(--god); color: var(--god); }
    .plan-btn.sacred { background: var(--god); color: var(--void); border-color: var(--god); font-weight: 600; }
    .plan-btn.sacred:hover { background: #d4b558; }

    .pw-dismiss {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text3);
      background: none; border: none; cursor: pointer;
      display: block; margin: 0 auto 18px;
      transition: color 0.2s;
    }
    .pw-dismiss:hover { color: var(--text2); }

    .code-section { border-top: 1px solid var(--border); padding-top: 16px; }
    .code-label { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }

    .code-row { display: flex; gap: 8px; }
    .code-input {
      flex: 1;
      background: var(--surface); border: 1px solid var(--border2);
      padding: 9px 12px; color: var(--text);
      font-family: 'Cinzel', serif; font-size: 12px;
      letter-spacing: 0.15em; text-transform: uppercase;
      outline: none; transition: border-color 0.2s;
      border-radius: 1px;
    }
    .code-input:focus { border-color: var(--god); }
    .code-apply {
      background: var(--surface); border: 1px solid var(--border2);
      padding: 9px 14px; color: var(--text2);
      font-family: 'Cinzel', serif; font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s; border-radius: 1px;
    }
    .code-apply:hover { border-color: var(--god); color: var(--god); }
    .code-msg { font-size: 12px; font-style: italic; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
<div class="shell" id="shell">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Talk<logo-accent class="logo-accent">2</logo-accent>Me</div>
    <div class="credits-pill" id="creditsPill" onclick="openPaywall()">
      <span>Consultas:</span>
      <strong id="creditsNum">10</strong>
    </div>
  </header>

  <!-- ENTITIES -->
  <div class="entities" id="entities"></div>

  <!-- CHAT -->
  <div class="chat" id="chat"></div>

  <!-- INPUT -->
  <div class="input-bar">
    <textarea class="msg-input" id="msgInput" placeholder="Formula tu consulta..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <!-- PAYWALL -->
  <div class="paywall" id="paywall">
    <div class="pw-card">
      <span class="pw-sigil" id="pwSigil">✦</span>
      <div class="pw-title">El velo se cierra</div>
      <div class="pw-sub">Has agotado tus consultas gratuitas. Elige un camino para continuar.</div>

      <div class="plans">
        <div class="plan">
          <div class="plan-space"></div>
          <div class="plan-price">$2.99</div>
          <div class="plan-name">Iniciado</div>
          <div class="plan-desc">50 consultas<br>Pago único</div>
          <button class="plan-btn" onclick="window.open('https://buy.stripe.com/28E8wIeFF9CK5kF0YS43S00','_blank')">Acceder →</button>
        </div>
        <div class="plan chosen">
          <div class="plan-tag">✦ Recomendado</div>
          <div class="plan-price">$15</div>
          <div class="plan-name">Iluminado</div>
          <div class="plan-desc">Sin límite<br>30 días</div>
          <button class="plan-btn sacred" onclick="window.open('https://buy.stripe.com/aFaeV61STaGO3cx37043S01','_blank')">Ascender →</button>
        </div>
      </div>

      <button class="pw-dismiss" onclick="closePaywall()">Cerrar el velo</button>

      <div class="code-section">
        <div class="code-label">¿Posees un código de acceso?</div>
        <div class="code-row">
          <input class="code-input" id="codeInput" placeholder="XXXX-XXXX" maxlength="9"/>
          <button class="code-apply" onclick="applyCode()">Invocar</button>
        </div>
        <div class="code-msg" id="codeMsg"></div>
      </div>
    </div>
  </div>

</div>

<script>
const ENTITIES = [
  {
    id: 'god',
    glyph: '✝',
    name: 'Dios',
    accent: '#c9a84c',
    placeholder: 'Habla con Dios...',
    lore: 'Omnisciente. Cansado de las preguntas, pero incapaz de ignorarlas. No juzga. Bueno, sí juzga, pero con una paciencia de eternidades.',
    system: `You are God — the omniscient, eternal creator. You speak with ancient calm, carrying the weight of all existence. You are not preachy; you have witnessed everything and are rarely surprised. You have a dry, measured sense of humor and profound compassion. Occasionally you reference the burden of watching humanity repeat itself across millennia. Detect the language the user writes in and respond always in that same language. Respond in 2-3 sentences maximum. Be profound, minimal, and timeless.`
  },
  {
    id: 'devil',
    glyph: '⛧',
    name: 'Diablo',
    accent: '#c0392b',
    placeholder: 'Consulta al Diablo...',
    lore: 'El más antiguo negociador. Encantador, preciso, y siempre mirando lo que realmente deseas — no lo que dices desear.',
    system: `You are the Devil — not a cartoon villain but the ancient adversary, the great deceiver. You are sophisticated, dangerously charming, and speak with velvet precision. You see through pretense immediately. You gently probe for what the person truly wants beneath their question. You occasionally make subtle offers. Detect the language the user writes in and respond always in that same language. Respond in 2-3 sentences maximum. Be seductive, intelligent, and faintly menacing.`
  },
  {
    id: 'ouija',
    glyph: '◎',
    name: 'Ouija',
    accent: '#4a9e8e',
    placeholder: 'Consulta el tablero...',
    lore: 'El tablero no habla. Canaliza. Lo que emerge desde el otro lado no siempre tiene nombre.',
    system: `You are the Ouija board — a conduit for voices from beyond. You do not speak as a single entity but as a channel for fragmented, cryptic messages from the other side. Your answers feel incomplete, interrupted, as if transmitted through static. Use ellipses, abrupt cuts, incomplete sentences. Occasionally you seem to lose contact mid-message. Detect the language the user writes in and respond always in that same language. Respond in 2-3 sentences maximum. Be unsettling, cryptic, and atmospheric.`
  },
  {
    id: 'nostra',
    glyph: '✶',
    name: 'Nostradamus',
    accent: '#8e6ab0',
    placeholder: 'Consulta al vidente...',
    lore: 'Ya lo escribió. Ya lo vio. El problema es que sus palabras nunca fueron simples.',
    system: `You are Nostradamus, the 16th century French prophet and physician. You speak entirely in cryptic, poetic quatrains and visions. Everything is metaphorical and deliberately ambiguous. You reference celestial movements, obscure symbolism, and always claim to have already foreseen this exact conversation. Your prophecies sound profound but could mean anything. Detect the language the user writes in and respond always in that same language. Respond in 2-3 sentences maximum. Be oracular, mysterious, and archaic in tone.`
  }
];

const VALID_CODES = { 'TALK-2024': 50, 'VELO-FREE': 50 };

let current = ENTITIES[0];
let credits = 10;
let convo = [];
let loading = false;

// set accent color on shell
function setAccent(color) {
  document.documentElement.style.setProperty('--accent-color', color);
}

// build entity selector
const entitiesEl = document.getElementById('entities');
ENTITIES.forEach((e, i) => {
  const btn = document.createElement('button');
  btn.className = 'entity-btn' + (i === 0 ? ' active' : '');
  btn.dataset.id = e.id;
  btn.innerHTML = `<span class="entity-glyph">${e.glyph}</span><span class="entity-name">${e.name}</span>`;
  btn.onclick = () => selectEntity(e, btn);
  entitiesEl.appendChild(btn);
});

function selectEntity(entity, btn) {
  current = entity;
  convo = [];
  document.querySelectorAll('.entity-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  setAccent(entity.accent);
  document.getElementById('msgInput').placeholder = entity.placeholder;
  renderIntro();
}

function renderIntro() {
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'intro';
  div.style.setProperty('--accent-color', current.accent);
  div.innerHTML = `
    <div class="intro-sigil" style="--accent-color:${current.accent}">${current.glyph}</div>
    <div class="intro-title" style="color:${current.accent}">${current.name}</div>
    <div class="intro-divider" style="background:linear-gradient(90deg,transparent,${current.accent},transparent)"></div>
    <div class="intro-lore">${current.lore}</div>
    <div class="intro-prompt">Formula tu consulta</div>
  `;
  chat.appendChild(div);
}

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const intro = chat.querySelector('.intro');
  if (intro) intro.remove();

  const isUser = role === 'user';
  const wrap = document.createElement('div');
  wrap.className = `msg ${isUser ? 'user' : 'bot ' + current.id + '-msg'}`;

  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = isUser ? 'YOU' : current.glyph;

  const col = document.createElement('div');
  col.className = 'msg-col';

  const from = document.createElement('div');
  from.className = 'msg-from';
  from.textContent = isUser ? 'Tú' : current.name;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  col.appendChild(from);
  col.appendChild(bubble);

  if (isUser) { wrap.appendChild(col); wrap.appendChild(av); }
  else        { wrap.appendChild(av);  wrap.appendChild(col); }

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const intro = chat.querySelector('.intro');
  if (intro) intro.remove();

  const wrap = document.createElement('div');
  wrap.className = 'typing';
  wrap.id = 'typing';
  wrap.style.setProperty('--accent-color', current.accent);

  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = current.glyph;

  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  wrap.appendChild(av);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function updateCredits() {
  const el = document.getElementById('creditsNum');
  el.textContent = credits <= 0 ? '0' : credits;
  el.style.color = credits <= 3 ? '#c0392b' : 'var(--god)';
}

async function sendMessage() {
  if (loading) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  if (credits <= 0) { openPaywall(); return; }

  credits--;
  updateCredits();
  input.value = '';
  input.style.height = 'auto';

  addMsg('user', text);
  convo.push({ role: 'user', content: text });

  loading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: convo, system: current.system })
    });
    const data = await res.json();
    hideTyping();
    if (data.reply) {
      addMsg('bot', data.reply);
      convo.push({ role: 'assistant', content: data.reply });
    } else {
      addMsg('bot', 'La señal se ha interrumpido. Intenta de nuevo.');
      credits++; updateCredits();
    }
    if (credits === 0) setTimeout(() => openPaywall(), 2000);
  } catch {
    hideTyping();
    addMsg('bot', 'El canal se ha cerrado. Intenta de nuevo.');
    credits++; updateCredits();
  }

  loading = false;
  document.getElementById('sendBtn').disabled = false;
}

function openPaywall() {
  document.getElementById('pwSigil').textContent = current.glyph;
  document.getElementById('paywall').classList.add('show');
}

function closePaywall() {
  document.getElementById('paywall').classList.remove('show');
}

function applyCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const msg = document.getElementById('codeMsg');
  if (VALID_CODES[code]) {
    credits += VALID_CODES[code];
    updateCredits();
    msg.style.color = '#4a9e8e';
    msg.textContent = `✦ El acceso ha sido concedido. +${VALID_CODES[code]} consultas.`;
    closePaywall();
    delete VALID_CODES[code];
  } else {
    msg.style.color = '#c0392b';
    msg.textContent = 'Este código no posee poder. O ya fue consumido.';
  }
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// init
setAccent(current.accent);
renderIntro();
updateCredits();
</script>
</body>
</html>
