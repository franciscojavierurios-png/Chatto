<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatto — Habla con lo que sea</title>
  <meta name="description" content="Chatta con Dios, el Diablo, Nostradamus, una pizza o un aguacate. 10 mensajes gratis." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #f5a623;
      --gold-dim: #f5a62318;
      --gold-border: #f5a62340;
      --bg: #f0f0ed;
      --bg2: #ffffff;
      --bg3: #f5f5f3;
      --bg4: #ebebea;
      --border: #e0e0dc;
      --border2: #d0d0cc;
      --text: #1a1a1a;
      --text2: #666;
      --text3: #aaa;
    }

    html, body {
      height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* LAYOUT */
    .app {
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      height: 100dvh;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg2);
      position: relative;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      color: #1a1a1a;
    }

    .logo span { color: var(--gold); }

    .header-tag {
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* CHARACTER SELECTOR */
    .selector-wrap {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
    }

    .selector-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .selector-scroll::-webkit-scrollbar { display: none; }

    .char-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background: var(--bg3);
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      min-width: 58px;
      font-family: 'DM Sans', sans-serif;
    }

    .char-btn:hover { background: var(--bg4); border-color: var(--border2); }

    .char-btn.active {
      background: #fff8ee;
      border-color: var(--gold);
    }

    .char-emoji { font-size: 20px; line-height: 1; }

    .char-label {
      font-size: 10px;
      color: var(--text2);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .char-btn.active .char-label { color: #c47d0a; }

    /* CHAT AREA */
    .chat-area {
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: #d0d0cc transparent;
      background: var(--bg);
    }

    /* INTRO CARD */
    .intro-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 20px;
      gap: 10px;
      flex: 1;
      animation: fadeUp 0.3s ease;
    }

    .intro-emoji {
      font-size: 52px;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
    }

    .intro-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #1a1a1a;
    }

    .intro-desc {
      font-size: 14px;
      color: var(--text2);
      max-width: 260px;
      line-height: 1.6;
    }

    .intro-hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text3);
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 5px 14px;
    }

    /* MESSAGES */
    .msg {
      display: flex;
      gap: 9px;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      background: var(--bg3);
      margin-top: 2px;
    }

    .msg.user .msg-avatar {
      background: #fff3e0;
      font-size: 10px;
      font-weight: 700;
      color: var(--gold);
      font-family: 'Syne', sans-serif;
      letter-spacing: -0.5px;
    }

    .msg-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 75%;
    }

    .msg.user .msg-col { align-items: flex-end; }

    .msg-sender {
      font-size: 11px;
      color: var(--text3);
      padding: 0 3px;
    }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
    }

    .msg.bot .msg-bubble {
      background: var(--bg3);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg.user .msg-bubble {
      background: var(--gold);
      color: #fff;
      font-weight: 500;
      border-bottom-right-radius: 4px;
    }

    /* TYPING */
    .typing-wrap {
      display: flex;
      gap: 9px;
      animation: fadeUp 0.2s ease;
    }

    .typing-bubble {
      background: var(--bg3);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 12px 14px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 6px; height: 6px;
      background: var(--text3);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); background: var(--text3); }
      30% { transform: translateY(-5px); background: var(--gold); }
    }

    /* INPUT */
    .input-area {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 11px 13px;
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }

    .msg-input {
      flex: 1;
      background: var(--bg3);
      border: 1.5px solid var(--border2);
      border-radius: 12px;
      padding: 10px 13px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      resize: none;
      max-height: 100px;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.4;
    }

    .msg-input::placeholder { color: var(--text3); }
    .msg-input:focus { border-color: rgba(255,216,77,0.4); }

    .send-btn {
      width: 40px; height: 40px;
      background: var(--gold);
      border: none;
      border-radius: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .send-btn:hover { background: #ffe770; transform: scale(1.04); }
    .send-btn:active { transform: scale(0.96); }
    .send-btn:disabled { background: var(--bg4); cursor: not-allowed; transform: none; }

    .send-btn svg { width: 17px; height: 17px; fill: #fff; }

    /* CREDIT BAR */
    .credit-bar {
      background: #fafaf8;
      border-top: 1px solid var(--border);
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .credits-info {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text3);
    }

    .credits-num {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--gold);
    }

    .pay-btn {
      font-size: 12px;
      font-weight: 600;
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid var(--gold-border);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      letter-spacing: 0.01em;
    }

    .pay-btn:hover { background: rgba(255,216,77,0.18); }

    /* PAYWALL OVERLAY */
    .paywall {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(240,240,237,0.93);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeUp 0.25s ease;
    }

    .paywall.show { display: flex; }

    .paywall-card {
      background: var(--bg2);
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 26px 22px;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }

    .paywall-emoji { font-size: 38px; margin-bottom: 10px; }

    .paywall-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .paywall-sub {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* PLANS GRID */
    .plans-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .plan-card {
      background: var(--bg3);
      border: 1.5px solid var(--border2);
      border-radius: 14px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .plan-card.featured {
      border-color: var(--gold);
      background: #fff8ee;
    }

    .plan-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--gold);
      background: rgba(255,216,77,0.15);
      border-radius: 20px;
      padding: 3px 10px;
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }

    .plan-badge-space { height: 22px; }

    .plan-price {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: #1a1a1a;
      line-height: 1;
    }

    .plan-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      letter-spacing: 0.03em;
    }

    .plan-desc {
      font-size: 11px;
      color: var(--text3);
      line-height: 1.5;
      text-align: center;
      margin: 4px 0 8px;
    }

    .plan-btn {
      width: 100%;
      background: var(--bg4);
      color: var(--text2);
      border: 1px solid var(--border2);
      border-radius: 9px;
      padding: 9px 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .plan-btn:hover { background: #2a2a2a; color: var(--text); }

    .plan-btn.gold {
      background: var(--gold);
      color: #0a0a0a;
      border-color: var(--gold);
    }

    .plan-btn.gold:hover { background: #e89620; }
    .plan-btn.gold { color: #fff; }

    .paywall-dismiss {
      font-size: 12px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      padding: 4px;
      margin-bottom: 4px;
    }

    .paywall-dismiss:hover { color: var(--text2); }

    /* CODE UNLOCK */
    .code-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .code-label {
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 8px;
    }

    .code-row {
      display: flex;
      gap: 8px;
    }

    .code-input {
      flex: 1;
      background: var(--bg3);
      border: 1.5px solid var(--border2);
      border-radius: 9px;
      padding: 9px 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .code-input:focus { border-color: rgba(255,216,77,0.4); }

    .code-apply {
      background: var(--bg3);
      border: 1.5px solid var(--border2);
      border-radius: 9px;
      padding: 9px 14px;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .code-apply:hover { border-color: var(--gold); color: var(--gold); }

    .code-error {
      font-size: 11px;
      color: #e24b4a;
      margin-top: 6px;
      min-height: 16px;
    }

    /* DESKTOP */
    @media (min-width: 520px) {
      body { display: flex; align-items: center; justify-content: center; background: var(--bg); }
      .app {
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid var(--border);
        height: min(820px, 94dvh);
        box-shadow: 0 20px 60px rgba(0,0,0,0.10);
      }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">chatto<span>.</span></div>
    <div class="header-tag">habla con lo que sea</div>
  </header>

  <!-- CHARACTER SELECTOR -->
  <div class="selector-wrap">
    <div class="selector-scroll" id="selector"></div>
  </div>

  <!-- CHAT -->
  <div class="chat-area" id="chatArea"></div>

  <!-- INPUT -->
  <div class="input-area">
    <textarea class="msg-input" id="msgInput" placeholder="Escribe algo..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>

  <!-- CREDIT BAR -->
  <div class="credit-bar">
    <div class="credits-info">

  <div class="paywall" id="paywall">

          <button class="plan-btn gold" id="btnSub">Suscribirme →</button>
        </div>
      </div>

      <button class="paywall-dismiss" id="paywallDismiss">No gracias, ya no quiero hablar</button>

      <div class="code-section">
        <div class="code-label">¿Ya pagaste? Ingresa tu código</div>
        <div class="code-row">
          <input class="code-input" id="codeInput" type="text" placeholder="XXXX-XXXX" maxlength="9" />
          <button class="code-apply" id="codeApply">Aplicar</button>
        </div>
        <div class="code-error" id="codeError"></div>
      </div>
    </div>
  </div>

</div>

<script>
const CHARACTERS = [
  {

const STRIPE_LINK_ONCE = 'https://buy.stripe.com/28E8wIeFF9CK5kF0YS43S00';
const STRIPE_LINK_SUB = 'https://buy.stripe.com/aFaeV61STaGO3cx37043S01';

  'CHAT-2024': 50,
  'DEMO-FREE': 50,
};

let credits = FREE_MESSAGES;
let conversation = [];
let isLoading = false;

// DOM
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const creditsNum = document.getElementById('creditsNum');
const paywall = document.getElementById('paywall');
const paywallEmoji = document.getElementById('paywallEmoji');
const paywallCta = document.getElementById('paywallCta');
const paywallDismiss = document.getElementById('paywallDismiss');
const codeInput = document.getElementById('codeInput');

const codeError = document.getElementById('codeError');

// Build selector
const selector = document.getElementById('selector');
CHARACTERS.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'char-btn' + (i === 0 ? ' active' : '');
  btn.innerHTML = `<span class="char-emoji">${c.emoji}</span><span class="char-label">${c.name}</span>`;
  btn.onclick = () => selectChar(c, btn);
  selector.appendChild(btn);
});

function renderIntro() {
  chatArea.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'intro-card';
  div.innerHTML = `
    <div class="intro-emoji">${currentChar.emoji}</div>
    <div class="intro-name">${currentChar.name}</div>
    <div class="intro-desc">${currentChar.desc}</div>
    <div class="intro-hint">Escribe algo para empezar</div>
  `;
  chatArea.appendChild(div);
}

function selectChar(char, btn) {
  currentChar = char;
  conversation = [];
  document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  msgInput.placeholder = char.placeholder;
  renderIntro();
}

function appendMessage(role, text) {
  // Remove intro if present
  const intro = chatArea.querySelector('.intro-card');
  if (intro) intro.remove();

  const isUser = role === 'user';
  const wrap = document.createElement('div');
  wrap.className = `msg ${isUser ? 'user' : 'bot'}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = isUser ? 'TÚ' : currentChar.emoji;

  const col = document.createElement('div');
  col.className = 'msg-col';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = isUser ? 'Tú' : currentChar.name;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  col.appendChild(sender);
  col.appendChild(bubble);

  if (isUser) {
    wrap.appendChild(col);
    wrap.appendChild(avatar);
  } else {
    wrap.appendChild(avatar);
    wrap.appendChild(col);
  }

  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const intro = chatArea.querySelector('.intro-card');
  if (intro) intro.remove();

  const wrap = document.createElement('div');
  wrap.className = 'typing-wrap';
  wrap.id = 'typingWrap';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = currentChar.emoji;

  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingWrap');
  if (t) t.remove();
}

function updateCredits() {
  creditsNum.textContent = credits;
  if (credits <= 0) creditsNum.style.color = '#e24b4a';
  else if (credits <= 3) creditsNum.style.color = '#ef9f27';
  else creditsNum.style.color = 'var(--gold)';
}

async function sendMessage() {
  if (isLoading) return;
  const text = msgInput.value.trim();
  if (!text) return;

  if (credits <= 0) {
    paywallEmoji.textContent = currentChar.emoji;
    paywall.classList.add('show');
    return;
  }

  credits--;
  updateCredits();
  msgInput.value = '';
  msgInput.style.height = 'auto';

  appendMessage('user', text);
  conversation.push({ role: 'user', content: text });

  isLoading = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: currentChar.system,
        messages: conversation
      })
    });

    const data = await res.json();
    const reply = data.content?.[0]?.text || '...';
    hideTyping();
    appendMessage('bot', reply);
    conversation.push({ role: 'assistant', content: reply });

    if (credits === 0) {
      setTimeout(() => {
        paywallEmoji.textContent = currentChar.emoji;
        paywall.classList.add('show');
      }, 1800);
    }

  } catch (err) {
    hideTyping();
    appendMessage('bot', '(Error de conexión. Intenta de nuevo.)');
    credits++; // refund on error
    updateCredits();
  }

  isLoading = false;
  sendBtn.disabled = false;
}

// Stripe buttons
document.getElementById('btnOnce').onclick = () => window.open(STRIPE_LINK_ONCE, '_blank');
document.getElementById('btnSub').onclick  = () => window.open(STRIPE_LINK_SUB,  '_blank');

document.getElementById('topBarPayBtn').onclick = () => {
  paywallEmoji.textContent = currentChar.emoji;
  paywall.classList.add('show');
};

paywallDismiss.onclick = () => {
  paywall.classList.remove('show');
};

// Code redemption
codeApply.onclick = () => {
  const code = codeInput.value.trim().toUpperCase();
  if (VALID_CODES[code]) {
    credits += VALID_CODES[code];
    updateCredits();
    codeError.style.color = '#1D9E75';
    codeError.textContent = `✓ Código aplicado — +${VALID_CODES[code]} mensajes`;
    paywall.classList.remove('show');
    delete VALID_CODES[code]; // one-time use
  } else {
    codeError.style.color = '#e24b4a';
    codeError.textContent = 'Código inválido o ya usado.';
  }
};

codeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') codeApply.click();
});

// Input events
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

msgInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

sendBtn.onclick = sendMessage;

// Init
renderIntro();
updateCredits();
</script>
</body>
</html>
