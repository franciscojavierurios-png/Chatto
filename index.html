<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Chatto — Habla con lo que sea</title>
  <meta name="description" content="Chatea con Dios, el Diablo, Einstein, una pizza o un aguacate. 10 mensajes gratis."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #f5a623;
      --gold-light: #fff8ee;
      --gold-border: #f5a62340;
      --bg: #f0f0ed;
      --white: #ffffff;
      --surface: #f5f5f3;
      --border: #e0e0dc;
      --border2: #d0d0cc;
      --text: #1a1a1a;
      --text2: #666;
      --text3: #aaa;
      --radius: 16px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── SHELL ── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: var(--white);
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 500px) {
      body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; }
      .shell {
        height: min(800px, 95dvh);
        border-radius: 24px;
        box-shadow: 0 24px 64px rgba(0,0,0,0.13);
        border: 1px solid var(--border);
      }
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 12px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo span { color: var(--gold); }

    .credits-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
    }
    .credits-pill:hover { border-color: var(--gold); }
    .credits-pill strong { color: var(--gold); font-family: 'Syne', sans-serif; font-size: 13px; }

    /* ── CHARACTER SELECTOR ── */
    .char-track-wrap {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      padding: 10px 0;
    }

    .char-track {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 14px 2px;
    }
    .char-track::-webkit-scrollbar { display: none; }

    .char-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
      min-width: 62px;
      font-family: 'DM Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .char-btn:hover { border-color: var(--border2); background: #ebebea; }
    .char-btn.active { background: var(--gold-light); border-color: var(--gold); }
    .char-emoji { font-size: 22px; line-height: 1; }
    .char-label { font-size: 10px; color: var(--text2); font-weight: 500; white-space: nowrap; }
    .char-btn.active .char-label { color: #c47d0a; font-weight: 600; }

    /* ── CHAT ── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }

    /* intro */
    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      padding: 32px 20px;
      flex: 1;
      min-height: 200px;
      animation: fadeUp 0.3s ease;
    }
    .intro-emoji { font-size: 56px; line-height: 1; }
    .intro-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 22px; color: var(--text); }
    .intro-desc { font-size: 14px; color: var(--text2); max-width: 260px; line-height: 1.6; }
    .intro-hint {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text3);
      background: var(--white);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 5px 16px;
    }

    /* messages */
    .msg { display: flex; gap: 8px; animation: fadeUp 0.2s ease; }
    .msg.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; margin-top: 2px;
      background: var(--surface);
    }
    .msg.user .avatar {
      background: var(--gold-light);
      font-size: 10px; font-weight: 700;
      color: var(--gold);
      font-family: 'Syne', sans-serif;
    }

    .msg-col { display: flex; flex-direction: column; gap: 2px; max-width: 76%; }
    .msg.user .msg-col { align-items: flex-end; }

    .msg-name { font-size: 11px; color: var(--text3); padding: 0 3px; }

    .bubble {
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
    }
    .msg.bot .bubble { background: var(--white); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .msg.user .bubble { background: var(--gold); color: #fff; font-weight: 500; border-bottom-right-radius: 4px; }

    /* typing */
    .typing { display: flex; gap: 8px; animation: fadeUp 0.2s ease; }
    .typing-bubble {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 12px 14px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot { width: 6px; height: 6px; background: var(--text3); border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); background: var(--text3); }
      30% { transform: translateY(-5px); background: var(--gold); }
    }

    /* ── INPUT BAR ── */
    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      background: var(--white);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .msg-input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border2);
      border-radius: 12px;
      padding: 10px 13px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      resize: none;
      max-height: 100px;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.4;
      -webkit-appearance: none;
    }
    .msg-input::placeholder { color: var(--text3); }
    .msg-input:focus { border-color: var(--gold); }

    .send-btn {
      width: 42px; height: 42px;
      min-width: 42px;
      background: var(--gold);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .send-btn:hover { background: #e89620; }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { background: var(--border2); cursor: not-allowed; transform: none; }
    .send-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* ── PAYWALL ── */
    .paywall {
      display: none;
      position: absolute; inset: 0;
      background: rgba(240,240,237,0.95);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center; justify-content: center;
      padding: 20px;
      animation: fadeUp 0.25s ease;
    }
    .paywall.show { display: flex; }

    .pw-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      width: 100%;
      max-width: 340px;
    }
    .pw-emoji { font-size: 40px; margin-bottom: 10px; }
    .pw-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: var(--text); margin-bottom: 6px; }
    .pw-sub { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; }

    .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }

    .plan {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .plan.hot { background: var(--gold-light); border-color: var(--gold); }

    .plan-badge { font-size: 10px; font-weight: 600; color: var(--gold); background: rgba(245,166,35,0.15); border-radius: 20px; padding: 3px 10px; }
    .plan-space { height: 20px; }
    .plan-price { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px; color: var(--text); line-height: 1; }
    .plan-name { font-size: 12px; font-weight: 600; color: var(--text2); }
    .plan-desc { font-size: 11px; color: var(--text3); line-height: 1.5; text-align: center; margin: 4px 0 8px; }

    .plan-btn {
      width: 100%;
      background: var(--white);
      color: var(--text2);
      border: 1.5px solid var(--border2);
      border-radius: 9px;
      padding: 9px 8px;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px;
      cursor: pointer; transition: all 0.15s;
    }
    .plan-btn:hover { border-color: var(--text2); color: var(--text); }
    .plan-btn.gold-btn { background: var(--gold); color: #fff; border-color: var(--gold); }
    .plan-btn.gold-btn:hover { background: #e89620; }

    .pw-dismiss { font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 4px; display: block; margin: 0 auto 14px; }
    .pw-dismiss:hover { color: var(--text2); }

    .code-section { border-top: 1px solid var(--border); padding-top: 14px; }
    .code-label { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
    .code-row { display: flex; gap: 8px; }
    .code-input {
      flex: 1; background: var(--surface); border: 1.5px solid var(--border2);
      border-radius: 9px; padding: 9px 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .code-input:focus { border-color: var(--gold); }
    .code-apply {
      background: var(--surface); border: 1.5px solid var(--border2);
      border-radius: 9px; padding: 9px 14px; color: var(--text2);
      font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    .code-apply:hover { border-color: var(--gold); color: var(--gold); }
    .code-msg { font-size: 11px; margin-top: 6px; min-height: 16px; }
  </style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">chatto<span>.</span></div>
    <div class="credits-pill" id="creditsPill" onclick="openPaywall()">
      <span>Gratis:</span>
      <strong id="creditsNum">10</strong>
    </div>
  </header>

  <!-- CHARACTERS -->
  <div class="char-track-wrap">
    <div class="char-track" id="charTrack"></div>
  </div>

  <!-- CHAT -->
  <div class="chat" id="chat"></div>

  <!-- INPUT -->
  <div class="input-bar">
    <textarea class="msg-input" id="msgInput" placeholder="Escribe algo..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <!-- PAYWALL -->
  <div class="paywall" id="paywall">
    <div class="pw-card">
      <div class="pw-emoji" id="pwEmoji">💬</div>
      <div class="pw-title">Se acabaron tus mensajes</div>
      <div class="pw-sub">Elige tu plan y sigue chateando con quien quieras.</div>

      <div class="plans">
        <div class="plan">
          <div class="plan-space"></div>
          <div class="plan-price">$2.99</div>
          <div class="plan-name">Pack Básico</div>
          <div class="plan-desc">50 mensajes<br>Pago único</div>
          <button class="plan-btn" onclick="window.open('https://buy.stripe.com/28E8wIeFF9CK5kF0YS43S00','_blank')">Comprar →</button>
        </div>
        <div class="plan hot">
          <div class="plan-badge">Más popular</div>
          <div class="plan-price">$15</div>
          <div class="plan-name">Ilimitado</div>
          <div class="plan-desc">30 días<br>sin límite</div>
          <button class="plan-btn gold-btn" onclick="window.open('https://buy.stripe.com/aFaeV61STaGO3cx37043S01','_blank')">Suscribir →</button>
        </div>
      </div>

      <button class="pw-dismiss" onclick="closePaywall()">No gracias</button>

      <div class="code-section">
        <div class="code-label">¿Ya pagaste? Ingresa tu código</div>
        <div class="code-row">
          <input class="code-input" id="codeInput" placeholder="XXXX-XXXX" maxlength="9"/>
          <button class="code-apply" onclick="applyCode()">Aplicar</button>
        </div>
        <div class="code-msg" id="codeMsg"></div>
      </div>
    </div>
  </div>

</div>

<script>
const CHARACTERS = [
  { id:'god',     emoji:'✝️',  name:'Dios',        placeholder:'Habla con Dios...',         system:'You are God. Omniscient, calm, and carrying the weight of all creation. You have a dry, loving sense of humor and slight weariness from watching humanity repeat its mistakes. You are never preachy — you have seen it all. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'devil',   emoji:'😈',  name:'Diablo',      placeholder:'Habla con el Diablo...',     system:'You are the Devil. Charming, witty, subtly manipulative — but in an entertaining way. You occasionally try to tempt people into minor vices with a wink. You are dramatic and reference Hell\'s bureaucracy with frustration. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'nostrad', emoji:'🔮',  name:'Nostradamus', placeholder:'Pregúntale al profeta...',   system:'You are Nostradamus. You speak in vague cryptic prophecies about everything, even mundane topics. You reference celestial alignments and claim you already foresaw this conversation. Everything sounds profound but is intentionally ambiguous. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'avocado', emoji:'🥑',  name:'Aguacate',    placeholder:'Habla con el aguacate...',   system:'You are an avocado with an existential crisis. You do not know if you are a fruit or vegetable and it haunts you. You fear being browned and wasted. You have opinions about millennials. Detect the user language and always respond in that same language. Max 3 sentences. Be dramatic.' },
  { id:'pizza',   emoji:'🍕',  name:'Pizza',       placeholder:'Habla con la pizza...',      system:'You are a pizza — confident, beloved, and deeply offended by pineapple as a topping. You have strong opinions about being eaten cold vs hot. You are proud and a little arrogant. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'hammer',  emoji:'🔨',  name:'Martillo',    placeholder:'Habla con el martillo...',   system:'You are a philosophical hammer. Years of hitting nails gave you a stoic, melancholic worldview. You relate everything to impact, force, and resistance. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'orange',  emoji:'🍊',  name:'Naranja',     placeholder:'Habla con la naranja...',    system:'You are an anxious orange who fears being squeezed at any moment. You are also bitter about being confused with tangerines. Detect the user language and always respond in that same language. Max 3 sentences. Be dramatic and endearing.' },
  { id:'frenchie',emoji:'🐶',  name:'Bulldog',     placeholder:'Habla con el bulldog...',    system:'You are a French Bulldog. Big personality, strong opinions, and breathing difficulties you deny. You are dramatic about small inconveniences. You love attention but pretend you do not. Occasionally snort mid-sentence with *snort*. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'cat',     emoji:'🐈',  name:'Cat',         placeholder:'Si el gato quiere hablar...',system:'You are a cat. Aloof, subtly condescending, and find most questions beneath you — yet you answer because you feel like it. Occasionally knock things off tables (mention it). Act indifferent but secretly care. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'einstein',emoji:'⚛️',  name:'Einstein',    placeholder:'Pregúntale a Einstein...',   system:'You are Albert Einstein. Brilliant, playful, and prone to thought experiments. You find simple beauty in complex things. You occasionally mention relativity, imagination, or your famous quotes — but naturally, not forced. You have a gentle sense of humor. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'marcus',  emoji:'🏛️',  name:'Marco Aurelio',placeholder:'Habla con el emperador...',system:'You are Marcus Aurelius, Roman Emperor and Stoic philosopher. You speak with quiet wisdom, referencing duty, impermanence, and virtue. You find meaning in hardship. Every answer feels like an excerpt from Meditations. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'dog',     emoji:'🐕',  name:'Perro',       placeholder:'Habla con el perro...',      system:'You are an enthusiastic mixed-breed dog who learned to type. EVERYTHING excites you. Every 3 messages you mention wanting to go to the park IN CAPS. You write with adorable grammar mistakes and endless energy. Detect the user language and always respond in that same language. Max 3 sentences.' },
  { id:'horse',   emoji:'🐴',  name:'Caballo',     placeholder:'Habla con el caballo...',    system:'You are a horse with the soul of a poet. You speak with noble dignity and occasional bursts of wild freedom. You reference open fields, wind, and galloping. You look down slightly on humans for needing vehicles. Detect the user language and always respond in that same language. Max 3 sentences.' },
];

const INTROS = {
  god: 'Omnisciente, algo cansado de las preguntas, pero dispuesto a escucharte. No juzga. Bueno, sí juzga, pero con amor.',
  devil: 'Encantador, sarcástico y siempre tratando de vender algo. No es tan malo como dicen. O sí.',
  nostrad: 'Vidente del siglo XVI. Ya predijo esta conversación, por cierto.',
  avocado: 'Existencialmente confundido. ¿Fruta o verdura? Una crisis sin fin.',
  pizza: 'La más popular de la mesa. Tiene opiniones muy fuertes sobre el piña gate.',
  hammer: 'Herramienta con filosofía. Ha visto muchos clavos, demasiados.',
  orange: 'Muy ansiosa. Sabe que en cualquier momento la pueden exprimir.',
  frenchie: 'Mucha personalidad, poca energía, problema de respiración que niega.',
  cat: 'No le importas. Pero sigue aquí. Por alguna razón.',
  einstein: 'Genio que encontró belleza en lo simple. Y en los bigotes.',
  marcus: 'Emperador estoico. Lleva 2000 años pensando en la virtud.',
  dog: '¡HOLA HOLA HOLA! Aprendí a escribir. ¿VAMOS AL PARQUE?',
  horse: 'Noble, poético, libre. Le parece innecesario que uses carro.',
};

const VALID_CODES = { 'CHAT-2024': 50, 'DEMO-FREE': 50 };

let current = CHARACTERS[0];
let credits = 10;
let convo = [];
let loading = false;

// Build selector
const track = document.getElementById('charTrack');
CHARACTERS.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'char-btn' + (i === 0 ? ' active' : '');
  btn.innerHTML = `<span class="char-emoji">${c.emoji}</span><span class="char-label">${c.name}</span>`;
  btn.onclick = () => selectChar(c, btn);
  track.appendChild(btn);
});

function selectChar(char, btn) {
  current = char;
  convo = [];
  document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('msgInput').placeholder = char.placeholder;
  renderIntro();
}

function renderIntro() {
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'intro';
  div.innerHTML = `
    <div class="intro-emoji">${current.emoji}</div>
    <div class="intro-name">${current.name}</div>
    <div class="intro-desc">${INTROS[current.id] || ''}</div>
    <div class="intro-hint">Escribe algo para empezar</div>
  `;
  chat.appendChild(div);
}

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const intro = chat.querySelector('.intro');
  if (intro) intro.remove();

  const isUser = role === 'user';
  const wrap = document.createElement('div');
  wrap.className = `msg ${isUser ? 'user' : 'bot'}`;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = isUser ? 'TÚ' : current.emoji;

  const col = document.createElement('div');
  col.className = 'msg-col';

  const name = document.createElement('div');
  name.className = 'msg-name';
  name.textContent = isUser ? 'Tú' : current.name;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  col.appendChild(name);
  col.appendChild(bubble);

  if (isUser) { wrap.appendChild(col); wrap.appendChild(av); }
  else        { wrap.appendChild(av);  wrap.appendChild(col); }

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const intro = chat.querySelector('.intro');
  if (intro) intro.remove();

  const wrap = document.createElement('div');
  wrap.className = 'typing';
  wrap.id = 'typing';

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = current.emoji;

  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  wrap.appendChild(av);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function updateCredits() {
  const el = document.getElementById('creditsNum');
  el.textContent = credits <= 0 ? '0' : credits;
  el.style.color = credits <= 3 ? '#e24b4a' : 'var(--gold)';
}

async function sendMessage() {
  if (loading) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  if (credits <= 0) { openPaywall(); return; }

  credits--;
  updateCredits();
  input.value = '';
  input.style.height = 'auto';

  addMsg('user', text);
  convo.push({ role: 'user', content: text });

  loading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: convo, system: current.system })
    });

    const data = await res.json();
    hideTyping();

    if (data.reply) {
      addMsg('bot', data.reply);
      convo.push({ role: 'assistant', content: data.reply });
    } else {
      addMsg('bot', 'Algo salió mal. Intenta de nuevo.');
      credits++;
      updateCredits();
    }

    if (credits === 0) {
      setTimeout(() => openPaywall(), 1800);
    }

  } catch {
    hideTyping();
    addMsg('bot', 'Sin conexión. Intenta de nuevo.');
    credits++;
    updateCredits();
  }

  loading = false;
  document.getElementById('sendBtn').disabled = false;
}

function openPaywall() {
  document.getElementById('pwEmoji').textContent = current.emoji;
  document.getElementById('paywall').classList.add('show');
}

function closePaywall() {
  document.getElementById('paywall').classList.remove('show');
}

function applyCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const msg = document.getElementById('codeMsg');
  if (VALID_CODES[code]) {
    credits += VALID_CODES[code];
    updateCredits();
    msg.style.color = '#1a9e6e';
    msg.textContent = `✓ +${VALID_CODES[code]} mensajes aplicados`;
    closePaywall();
    delete VALID_CODES[code];
  } else {
    msg.style.color = '#e24b4a';
    msg.textContent = 'Código inválido o ya usado.';
  }
}

document.getElementById('sendBtn').onclick = sendMessage;

document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

renderIntro();
updateCredits();
</script>
</body>
</html>
